<section class="not-found" role="main" aria-label="Page not found">
  <h1 class="lead-title">{{ title || 'Page Not Found' }}</h1>
  <p class="lead-message">{{ message || "The page you're looking for doesn't exist or was moved." }}</p>
  <div class="art" aria-hidden="true" *ngIf="!iconUrl">
    <svg viewBox="0 0 300 160" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="var(--accent)" />
          <stop offset="100%" stop-color="var(--accent-2)" />
        </linearGradient>
      </defs>
      <!-- backdrop card -->
      <rect x="40" y="10" width="220" height="140" rx="22" fill="url(#g)" opacity="0.18" />

      <!-- broken bot head -->
      <rect x="90" y="52" width="120" height="70" rx="12" fill="#0f1220" stroke="url(#g)" stroke-width="3" />
      <!-- antenna base -->
      <line x1="150" y1="42" x2="150" y2="54" stroke="url(#g)" stroke-width="3" stroke-linecap="round" />
      <!-- broken antenna tip -->
      <circle cx="150" cy="38" r="5" fill="#ff7b7b" />
      <line x1="146" y1="34" x2="154" y2="42" stroke="#ffd0d0" stroke-width="2" stroke-linecap="round" />

      <!-- eyes: X for broken -->
      <line x1="115" y1="74" x2="125" y2="84" stroke="url(#g)" stroke-width="3" stroke-linecap="round" />
      <line x1="125" y1="74" x2="115" y2="84" stroke="url(#g)" stroke-width="3" stroke-linecap="round" />
      <line x1="175" y1="74" x2="185" y2="84" stroke="url(#g)" stroke-width="3" stroke-linecap="round" />
      <line x1="185" y1="74" x2="175" y2="84" stroke="url(#g)" stroke-width="3" stroke-linecap="round" />

      <!-- mouth: zigzag to indicate malfunction -->
      <path d="M120 98 l 12 -6 l 12 6 l 12 -6 l 12 6" fill="none" stroke="#ff7b7b" stroke-width="3" stroke-linecap="round" />

      <!-- left arm attached -->
      <rect x="78" y="72" width="12" height="26" rx="4" fill="#0f1220" stroke="url(#g)" stroke-width="3" />
      <circle cx="74" cy="100" r="4" fill="#ffb3b3" />

      <!-- right arm detached -->
      <rect x="210" y="70" width="12" height="26" rx="4" fill="#0f1220" stroke="url(#g)" stroke-width="3" />
      <circle cx="230" cy="112" r="4" fill="#ffd0d0" />
      <line x1="222" y1="98" x2="236" y2="110" stroke="#ff7b7b" stroke-width="2.5" stroke-linecap="round" />

      <!-- bolts/sparks falling -->
      <circle cx="150" cy="122" r="2.4" fill="#ffb3b3" />
      <circle cx="160" cy="128" r="1.8" fill="#ffd0d0" />
    </svg>
  </div>
  <img *ngIf="iconUrl" [src]="iconUrl" [alt]="iconAlt" class="art-img" />
  <div class="code" aria-hidden="true">404</div>
  <div class="content">
    <a [routerLink]="homeUrl" class="cta" aria-label="Go to homepage">Go to homepage</a>
  </div>
</section>
