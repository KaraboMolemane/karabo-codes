<section class="nf">
  <h1 class="nf__title">{{ title || 'Page not found' }}</h1>
  <p class="nf__message">
    {{ message || "Sorry, we couldn't find the page you're looking for." }}
  </p>

  <div class="nf__icon">
    <ng-container *ngIf="iconUrl; else builtIn">
      <img [src]="iconUrl" [alt]="iconAlt || 'Not found'" />
    </ng-container>
    <ng-template #builtIn>
      <svg
        width="220"
        height="160"
        viewBox="0 0 220 160"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
        focusable="false"
      >
        <defs>
          <linearGradient id="botGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="var(--accent)" />
            <stop offset="100%" stop-color="var(--accent-2)" />
          </linearGradient>
        </defs>
        <g fill="none" stroke="var(--muted)" stroke-width="2">
          <rect x="50" y="40" width="120" height="80" rx="12" fill="url(#botGrad)" />
          <circle cx="85" cy="75" r="8" fill="#111" />
          <circle cx="135" cy="75" r="8" fill="#111" />
          <line x1="75" y1="110" x2="95" y2="130" />
          <line x1="145" y1="110" x2="125" y2="130" />
          <line x1="110" y1="40" x2="110" y2="20" />
          <circle cx="110" cy="15" r="5" fill="var(--muted)" />
          <line x1="70" y1="60" x2="95" y2="60" stroke="#111" />
          <line x1="125" y1="60" x2="150" y2="60" stroke="#111" />
          <line x1="100" y1="92" x2="120" y2="92" stroke="#111" stroke-dasharray="4 3" />
          <line x1="30" y1="90" x2="50" y2="90" stroke="var(--muted)" stroke-dasharray="3 3" />
          <line x1="170" y1="90" x2="190" y2="90" stroke="var(--muted)" stroke-dasharray="3 3" />
        </g>
      </svg>
    </ng-template>
  </div>

  <div class="nf__code">404</div>

  <div class="nf__actions">
    <a class="nf__cta" [routerLink]="homeUrl">Go to homepage</a>
    <div class="nf__links">
      <a [routerLink]="homeUrl">Home</a>
      <a href="mailto:contact@karabo.codes">Contact</a>
    </div>
  </div>
</section>
